<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ToyDigi</title>
<meta name="description" content="레트로 디카·필름 필터 카메라" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ToyDigi" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="rotor">

<!-- ===== 시작 화면 ===== -->
<div id="start" class="screen">
  <div class="start-card">
    <img class="start-icon" src="icons/icon-192.png" alt="" />
    <h1 class="start-title">ToyDigi</h1>
    <p class="start-sub">레트로 디카 · 필름 필터 카메라</p>
    <button id="startBtn" class="btn-filled">카메라 시작</button>
    <p id="startHint" class="start-hint">카메라 접근을 허용해 주세요</p>
    <div id="startGuide" class="start-guide hidden"></div>
  </div>
</div>

<!-- ===== 메인 카메라 ===== -->
<div id="camera" class="screen hidden">

  <!-- 상단 바 (인플로우 · 프리뷰와 겹치지 않음) -->
  <header class="topbar">
    <span class="tb-side"></span>
    <div id="recBadge" class="lg rec-badge hidden"><span class="rb-dot"></span><span id="recTime">0:00</span></div>
    <button id="settingsBtn" class="lg lg-btn tb-side" aria-label="설정">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <span id="frameCount" hidden></span>
  </header>

  <!-- 프리뷰 무대 -->
  <main class="stage">
    <div id="viewfinder" class="viewfinder">
      <video id="video" playsinline autoplay muted></video>
      <div class="layer tint"></div>
      <div class="layer leak"></div>
      <div class="layer grain"></div>
      <div class="layer scanline"></div>
      <div class="layer vignette"></div>
      <div id="dateStamp" class="date-stamp"></div>
      <div id="hudPreset" class="filter-toast"></div>
      <div id="flash" class="flash"></div>
      <div id="developing" class="developing hidden"><span class="spinner"></span></div>
    </div>
    <!-- 줌 다이얼(반원) — 줌 조작 시 표시 -->
    <div id="zoomArc" class="zoom-arc hidden">
      <div class="za-value" id="zaValue">1×</div>
      <div class="za-dial" id="zaDial"></div>
      <div class="za-pointer"></div>
    </div>
  </main>

  <!-- 필터 캐러셀 (세로:가로스크롤 / 가로:세로스크롤) -->
  <div class="filter-bar" id="presetBar"></div>

  <!-- 컨트롤 독 (세로:하단 / 가로:오른쪽 세로줄) -->
  <div class="dock">
    <div class="dock-mid">
      <div class="mode-capsule lg" id="modeSeg">
        <span class="mode-ind"></span>
        <button data-mode="photo" class="mode-btn active">사진</button>
        <button data-mode="video" class="mode-btn">비디오</button>
      </div>
      <button id="zoomQuick" class="lg zoom-quick">1×</button>
    </div>
    <div class="controls">
      <button id="galleryBtn" class="thumb-btn lg" aria-label="갤러리"><span id="lastThumb"></span></button>
      <button id="shutter" class="shutter" aria-label="촬영"><span class="shutter-core"></span></button>
      <button id="flipBtn" class="lg lg-btn flip" aria-label="전후면 전환">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
    </div>
  </div>

  <canvas id="recordCanvas" hidden></canvas>
</div>

<!-- ===== 설정 시트 ===== -->
<div id="settings" class="sheet hidden">
  <div class="sheet-card">
    <div class="grabber"></div>
    <div class="sheet-head"><span class="sheet-title">설정</span><button id="settingsClose" class="done-btn">완료</button></div>

    <div class="group">
      <div class="set-row"><span>날짜 각인</span><button class="sw" data-set="date"></button></div>
      <div class="set-row"><span>셔터음</span><button class="sw" data-set="sound"></button></div>
      <div class="set-row"><span>진동</span><button class="sw" data-set="vibrate"></button></div>
      <div class="set-row"><span>셀카 좌우반전</span><button class="sw" data-set="mirror"></button></div>
      <div class="set-row"><span>영상 소리 (마이크)</span><button class="sw" data-set="mic"></button></div>
    </div>

    <p class="group-label">화질</p>
    <div class="group pad">
      <div class="seg lofi" id="lofiSeg">
        <button data-lofi="sharp">선명</button>
        <button data-lofi="normal">보통</button>
        <button data-lofi="vintage">빈티지</button>
        <button data-lofi="trashy">막구짐</button>
        <button data-lofi="qvga">QVGA</button>
      </div>
    </div>
    <p class="group-foot">낮을수록 해상도가 떨어지고 거칠어져 옛 디카 느낌이 납니다. 사진·영상 모두 적용.</p>
  </div>
</div>

<!-- ===== 촬영 결과 ===== -->
<div id="result" class="screen hidden">
  <header class="view-top">
    <button id="retakeBtn" class="text-btn">
      <svg viewBox="0 0 24 24" class="ic sm"><path d="M15 18l-6-6 6-6"/></svg>다시
    </button>
  </header>
  <div class="media-wrap">
    <img id="resultImg" alt="촬영 결과" />
    <video id="resultVideo" class="hidden" playsinline controls loop></video>
  </div>
  <footer class="view-bottom">
    <button id="saveBtn" class="pill-action primary">
      <svg viewBox="0 0 24 24" class="ic sm"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>저장
    </button>
  </footer>
</div>

<!-- ===== 갤러리 ===== -->
<div id="gallery" class="screen hidden">
  <header class="gallery-head">
    <button id="galleryClose" class="text-btn"><svg viewBox="0 0 24 24" class="ic sm"><path d="M15 18l-6-6 6-6"/></svg>카메라</button>
    <span class="gallery-title">필름롤 <span id="galleryCount" class="g-count"></span></span>
    <div class="gallery-head-right">
      <button id="gallerySelDel" class="text-btn danger hidden">삭제</button>
      <button id="gallerySelectBtn" class="text-btn">선택</button>
    </div>
  </header>
  <div id="galleryGrid" class="gallery-grid"></div>
  <p id="galleryEmpty" class="empty-note">아직 찍은 사진이 없어요</p>
</div>

<!-- 사진/영상 크게보기 -->
<div id="viewer" class="screen hidden">
  <header class="view-top">
    <button id="viewerClose" class="text-btn"><svg viewBox="0 0 24 24" class="ic sm"><path d="M15 18l-6-6 6-6"/></svg>필름롤</button>
    <button id="viewerDelete" class="icon-only danger" aria-label="삭제">
      <svg viewBox="0 0 24 24" class="ic"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
  </header>
  <div class="media-wrap">
    <img id="viewerImg" alt="" />
    <video id="viewerVideo" class="hidden" playsinline controls loop></video>
  </div>
  <p id="viewerMeta" class="viewer-meta"></p>
  <footer class="view-bottom">
    <button id="viewerSave" class="pill-action primary">
      <svg viewBox="0 0 24 24" class="ic sm"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>저장
    </button>
  </footer>
</div>

</div><!-- /#rotor -->

<script src="presets.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
